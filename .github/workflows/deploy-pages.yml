name: Deploy NutriTrack to GitHub Pages

on:
  push:
    branches: [arena/2b392ee6-nutritrack]
  workflow_dispatch:

# The repo's GitHub Pages site is served (legacy) from the gh-pages branch, so
# this workflow builds the web bundle and publishes it there with the built-in
# token. No manual branch pushes are required.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx expo export --platform web

      # Single-page app: serve the app shell for unknown routes so deep links
      # like /login keep working after a refresh on GitHub Pages.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
