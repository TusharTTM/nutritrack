name: Deploy NutriTrack to GitHub Pages

on:
  push:
    branches: [arena/2b392ee6-nutritrack]
  workflow_dispatch:

# The repo's GitHub Pages site is served (legacy) from the gh-pages branch, so
# this workflow builds the web bundle and publishes it there with the built-in
# token. No manual branch pushes are required.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx expo export --platform web

      # Copies the shell to 404.html for the SPA fallback, then injects the
      # social/SEO/PWA tags and the browser-surface CSS into both files.
      - name: Finalize web build
        run: node scripts/finalize-web.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
